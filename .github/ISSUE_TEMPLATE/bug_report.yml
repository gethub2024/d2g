name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste tokens, private keys, spreadsheet contents or real user
        data.** Redact anything sensitive before submitting. For security
        issues, use [SECURITY.md](https://github.com/gethub2024/d2g/blob/main/SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create tabs DA, DT, PIT, logs
        2. Run npm start
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the console output, with secrets removed.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Where does it run?
      options:
        - GitHub Actions (scheduled workflow)
        - Locally (npm start)
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: '22.12.0'
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I removed all tokens, keys and personal data from this report.
          required: true
        - label: I checked the troubleshooting section of the README.
          required: false
