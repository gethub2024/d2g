name: Daily Discord Bot

on:
  # ─────────────────────────────────────────────────────────
  # Change time (IST):
  #   8:32 AM IST  →  "2 3 * * *"   (3:02 UTC)
  # Formula: UTC hour = IST hour - 5, UTC min = IST min - 30
  # ─────────────────────────────────────────────────────────
  schedule:
    - cron: '2 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-bot]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Create .env
        run: |
          echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" >> .env
          echo "CHANNEL_1_ID=${{ secrets.CHANNEL_1_ID }}" >> .env
          echo "CHANNEL_2_ID=${{ secrets.CHANNEL_2_ID }}" >> .env
          echo "CHANNEL_3_ID=${{ secrets.CHANNEL_3_ID }}" >> .env
          echo "SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }}" >> .env
          echo "ERROR_CHANNEL_ID=${{ secrets.ERROR_CHANNEL_ID }}" >> .env
      - name: Create file.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: echo "$GOOGLE_CREDENTIALS" > file.json
      - name: Check GitHub Actions billing
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          USER=$(gh api /user --jq '.login')
          echo "GH_INCLUDED_MINUTES=$(gh api /users/$USER/settings/billing/actions --jq '.included_minutes')" >> $GITHUB_ENV
          echo "GH_USED_MINUTES=$(gh api /users/$USER/settings/billing/actions --jq '.total_minutes_used')" >> $GITHUB_ENV
      - run: npm start
