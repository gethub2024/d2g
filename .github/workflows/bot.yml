name: Daily Discord Bot

on:
  # ─────────────────────────────────────────────────────────
  # Backup schedule (primary is cron-job.org at 8:32 AM IST):
  #   9:00 AM IST  →  "30 3 * * *"   (3:30 UTC)
  # Formula: UTC hour = IST hour - 5, UTC min = IST min - 30
  # ─────────────────────────────────────────────────────────
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-bot]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Create .env
        run: |
          echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" >> .env
          echo "CHANNEL_1_ID=${{ secrets.CHANNEL_1_ID }}" >> .env
          echo "CHANNEL_2_ID=${{ secrets.CHANNEL_2_ID }}" >> .env
          echo "CHANNEL_3_ID=${{ secrets.CHANNEL_3_ID }}" >> .env
          echo "SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }}" >> .env
          echo "ERROR_CHANNEL_ID=${{ secrets.ERROR_CHANNEL_ID }}" >> .env
      - name: Create file.json
        run: |
          cat > file.json <<'EOF'
          ${{ secrets.GOOGLE_CREDENTIALS }}
          EOF
      - run: npm start
